<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0f18">
<title>ᴘʀᴇᴘᴀʀɪɴɢ ʏᴏᴜʀ ᴅᴏᴡɴʟᴏᴀᴅ ʟɪɴᴋ...</title>
<style>
  :root { --ink:#ffffff; --ink2:#cbd5e1; --cyan:#06b6d4; --magenta:#ec4899; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; width:100%; height:100%; overflow-x:hidden; }
  body { min-height:100vh; min-height:100dvh; display:flex; padding:16px; color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
         background:
           radial-gradient(60vmax 60vmax at 10% 6%, rgba(6,182,212,.35), rgba(0,0,0,0) 60%),
           radial-gradient(55vmax 55vmax at 94% 16%, rgba(236,72,153,.35), rgba(0,0,0,0) 62%),
           radial-gradient(70vmax 70vmax at 80% 100%, rgba(139,92,246,.30), rgba(0,0,0,0) 60%),
           linear-gradient(135deg,#090d16 0%,#111827 50%,#06080e 100%); }

  /* background colour shapes */
  .shape { position:fixed; border-radius:50%; pointer-events:none; filter:blur(20px); opacity:0.6; }
  .s1 { width:180px; height:180px; left:-40px; top:5%;
        background:linear-gradient(145deg,#06b6d4,#3b82f6); box-shadow:0 30px 60px -20px rgba(6,182,212,.5); }
  .s2 { width:200px; height:200px; right:-50px; bottom:5%;
        background:linear-gradient(145deg,#ec4899,#8b5cf6 55%,#06b6d4); box-shadow:0 30px 70px -24px rgba(236,72,153,.5); }

  /* glass container optimized for mobile screens */
  .card { position:relative; z-index:2; width:100%; max-width:380px; margin:auto; padding:24px 18px 20px;
          text-align:center; border-radius:28px;
          background:linear-gradient(160deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 100%);
          border:1px solid rgba(255,255,255,.18);
          -webkit-backdrop-filter:blur(25px) saturate(190%); backdrop-filter:blur(25px) saturate(190%);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.6),
                     0 24px 50px -12px rgba(0,0,0,.8);
          animation:rise .6s cubic-bezier(.22,1,.36,1) both; }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .card { background:rgba(17,24,39,.96); } }
  .card::before { content:""; position:absolute; top:0;right:0;bottom:0;left:0; border-radius:inherit; padding:1px; pointer-events:none;
          background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 38%,rgba(255,255,255,.15));
          -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0); }
  .card > * { position:relative; z-index:1; }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } }

  .logo-wrap { width:72px; height:72px; margin:0 auto 10px; padding:3px; border-radius:50%;
               background:linear-gradient(145deg,rgba(6,182,212,.4),rgba(236,72,153,.2));
               box-shadow:0 10px 24px -8px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.25); }
  .logo, .fb { width:100%; height:100%; border-radius:50%; object-fit:contain; background:#000; display:block; }
  .fb { display:none; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#fff; }

  .brand { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; color:#ffffff; text-shadow:0 2px 4px rgba(0,0,0,.4); }
  .badge { display:inline-flex; align-items:center; gap:6px; margin:8px 0 0; padding:5px 10px; border-radius:99px;
           font-size:11.5px; font-weight:600; color:#38bdf8; background:rgba(6,182,212,.15);
           box-shadow:inset 0 0 0 1px rgba(56,189,248,.35), 0 4px 12px -6px rgba(6,182,212,.5); }
  .badge i { width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.25); }

  /* -------------- CYBER MATRIX CORE ANIMATION -------------- */
  .core-container {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 18px auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer glowing rotating ring */
  .core-ring {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px dashed rgba(6, 182, 212, 0.4);
    animation: rotateRing 8s linear infinite;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
  }
  @keyframes rotateRing { 100% { transform: rotate(360deg); } }

  /* Inner pulsating energy aura */
  .core-pulse {
    position: absolute;
    width: 80%; height: 80%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, rgba(236, 72, 153, 0.15) 60%, transparent 80%);
    animation: pulseCore 2s ease-in-out infinite alternate;
  }
  @keyframes pulseCore {
    0% { transform: scale(0.85); opacity: 0.5; }
    100% { transform: scale(1.1); opacity: 0.9; }
  }

  /* Cyber Scanning Arc */
  .core-arc {
    position: absolute;
    width: 110%; height: 110%;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #38bdf8;
    border-bottom-color: #ec4899;
    animation: rotateArc 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
  }
  @keyframes rotateArc { 100% { transform: rotate(720deg); } }

  /* Countdown & Progress Overlay inside Core */
  .core-info {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .num {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
  }
  .num.pop { animation: pop .35s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { from { transform:scale(.8); opacity:.2; } to { transform:none; opacity:1; } }

  .pct-text {
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 1px;
    margin-top: -2px;
  }

  /* Progress Bar Below Core */
  .progress-wrap {
    width: 85%;
    height: 5px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    margin: 0 auto 16px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
    border-radius: 10px;
    transition: width 1s linear;
    box-shadow: 0 0 10px #06b6d4;
  }

  h2 { margin:0 0 4px; font-size:17px; font-weight:650; letter-spacing:-.015em; color:#ffffff; }
  .sub { margin:0 0 16px; font-size:13px; color:#cbd5e1; font-weight:500; }

  /* buttons adjusted for easier mobile tapping */
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px;
         border:0; border-radius:14px; font-family:inherit; font-size:15px; font-weight:600; letter-spacing:-.01em;
         color:#ffffff; text-decoration:none; cursor:pointer;
         background:linear-gradient(180deg,#06b6d4 0%,#2563eb 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.3),
                    0 12px 22px -8px rgba(6,182,212,.6);
         transition:transform .15s ease, opacity .3s ease; }
  .btn:active { transform:scale(0.96); }
  .btn.wait { opacity:.55; pointer-events:none; }
  .btn.ready { animation:pop .35s cubic-bezier(.22,1,.36,1); }
  .spin { width:15px; height:15px; border-radius:50%; border:2.3px solid rgba(255,255,255,.4);
          border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ghost { margin-top:8px; color:#ffffff; background:rgba(255,255,255,.1);
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.2), inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px -8px rgba(0,0,0,.5); }
  .ghost svg { fill:#38bdf8; }

  .foot { margin-top:14px; font-size:11.5px; color:#94a3b8; letter-spacing:.2px; font-weight:500; }
</style>
</head>
<body>
  <div class="shape s1"></div><div class="shape s2"></div>

  <main class="card" id="card">
    <div class="logo-wrap">
      <img class="logo" src="https://iili.io/nWD8HYB.jpg" alt="Hari Moviez"
           onerror="this.style.display='none';document.getElementById('fb').style.display='flex'">
      <div class="fb" id="fb">ʜᴍ</div>
    </div>
    <h1 class="brand">ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ</h1>
    <div class="badge"><i></i> ꜱᴇᴄᴜʀᴇᴅ &amp; ᴠᴇʀɪғɪᴇᴅ ʟɪɴᴋ</div>

    <!-- Cyber Matrix Core Loader -->
    <div class="core-container">
      <div class="core-ring"></div>
      <div class="core-pulse"></div>
      <div class="core-arc"></div>
      
      <div class="core-info">
        <div class="num" id="n">10</div>
        <div class="pct-text" id="pctText">0%</div>
      </div>
    </div>

    <!-- Live Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-fill" id="pFill"></div>
    </div>

    <h2>ᴘʟᴇᴀsᴇ wᴀɪᴛ wʜɪʟᴇ ᴏᴘᴇɴɪɴɢ lɪɴᴋ...</h2>
    <p class="sub" id="status-text">⚡ ʏᴏᴜʀ lɪɴᴋ ɪs aʟᴍᴏsᴛ rᴇᴀᴅʏ...</p>

    <a class="btn wait" id="go" href="#" rel="noreferrer"><span class="spin" id="sp"></span><span id="gt">ᴘʟᴇᴀsᴇ wᴀɪᴛ…</span></a>
    <a class="btn ghost" href="https://t.me/hari_moviez" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>⚡ ʜᴀʀɪ ᴍᴀɪɴ ᴄʜᴀɴɴᴇʟ ✨</a>

    <div class="foot">⚡ ʜᴀʀɪ ᴍᴏᴠɪᴇᴢ ꜱᴇᴄᴜʀɪᴛʏ</div>
  </main>

<script>
  function getTargetUrl() {
    const path = window.location.pathname;
    const searchParams = new URLSearchParams(window.location.search);
    const pathParts = path.split('/').filter(Boolean);
    let rawToken = "";
    
    const tokenIndex = pathParts.indexOf("token");
    if (tokenIndex !== -1 && pathParts.length > tokenIndex + 2) {
        rawToken = pathParts[tokenIndex + 2];
    } else if (pathParts.length > 0) {
        rawToken = pathParts[pathParts.length - 1];
    }

    if (!rawToken || rawToken === "index.html") {
        rawToken = searchParams.get("token") || searchParams.get("redirect");
    }

    if (!rawToken) return null;

    try {
        let base64 = rawToken.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
            base64 += '=';
        }
        const decodedJson = atob(base64);
        const parsed = JSON.parse(decodedJson);
        return parsed.url || null;
    } catch (e) {
        try {
            return decodeURIComponent(rawToken);
        } catch (_) {
            return null;
        }
    }
  }

  const decodedTargetUrl = getTargetUrl();
  const statusElement = document.getElementById("status-text");
  const goBtn = document.getElementById("go");

  if (!decodedTargetUrl || !(decodedTargetUrl.startsWith("http://") || decodedTargetUrl.startsWith("https://"))) {
      statusElement.textContent = "Invalid or missing secure token!";
      document.getElementById("gt").textContent = "Invalid Link";
      document.getElementById("sp").style.display = "none";
      throw new Error("Invalid URL");
  }

  goBtn.href = decodedTargetUrl;
  document.getElementById("card").classList.add("run");

  let totalTime = 10;
  let timeLeft = totalTime;
  const numEl = document.getElementById("n");
  const pctEl = document.getElementById("pctText");
  const pFillEl = document.getElementById("pFill");
  const gtEl = document.getElementById("gt");
  const spEl = document.getElementById("sp");

  numEl.textContent = timeLeft;

  const countdown = setInterval(() => {
    timeLeft--;
    
    const progressPct = Math.round(((totalTime - timeLeft) / totalTime) * 100);
    pFillEl.style.width = progressPct + "%";
    pctEl.textContent = progressPct + "%";

    if (timeLeft >= 0) {
      numEl.textContent = timeLeft;
      numEl.classList.remove("pop");
      void numEl.offsetWidth;
      numEl.classList.add("pop");

      if (timeLeft <= 3) {
        statusElement.textContent = "🚀 Opening destination link...";
      } else if (timeLeft <= 6) {
        statusElement.textContent = "🔓 Decrypting secure token...";
      } else {
        statusElement.textContent = "⚡ Your link is almost ready...";
      }
    }

    if (timeLeft <= 0) {
      clearInterval(countdown);
      numEl.textContent = "0";
      pctEl.textContent = "100%";
      pFillEl.style.width = "100%";
      statusElement.textContent = "✨ Redirecting now...";
      
      goBtn.className = "btn ready";
      spEl.style.display = "none";
      gtEl.textContent = "Proceed to Destination \u2192";
      
      setTimeout(() => {
          window.location.href = decodedTargetUrl;
      }, 300);
    }
  }, 1000);
</script>
</body>
</html>
